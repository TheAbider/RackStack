ShortDescription: Interactive and headless server configuration tool for Windows Server.
Description: |-
  RackStack is a PowerShell-based interactive and headless configuration tool for Windows
  Server hosts. It ships a single portable EXE that exposes 170+ CLI actions covering
  networking, Hyper-V, iSCSI/MPIO, Failover Clustering, BitLocker, Defender, Storage Replica,
  VM deployment, and a wide catalog of audit actions (firewall, TLS, SMB, AD, etc). Headless
  mode supports JSON output, silent prompts, ndjson event streams for long-running batches,
  and built-in self-update / rollback / scheduled update checks.
