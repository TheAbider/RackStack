name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # Push = self-hosted (fast, only repo owner can push). PR = GitHub-hosted (safe from fork attacks).
    runs-on: ${{ github.event_name == 'pull_request' && 'windows-latest' || 'self-hosted' }}
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        run: |
          if (-not (Get-Module PSScriptAnalyzer -ListAvailable)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }

      - name: Generate monolithic
        run: .\sync-to-monolithic.ps1

      - name: PSScriptAnalyzer
        run: .\Tests\pssa-check.ps1

      - name: Parse check
        run: .\Tests\parse-check.ps1

      - name: Run tests (core)
        env:
          RACKSTACK_CI: 'true'
        run: |
          # Core tests: parse, module load, function existence, validation, navigation
          & .\Tests\Run-Tests.ps1 -Quick
          exit $LASTEXITCODE

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure-logs
          path: |
            builds/RackStack v*.ps1
            Tests/*.log
          retention-days: 7
