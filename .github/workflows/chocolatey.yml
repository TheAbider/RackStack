name: Chocolatey submission

# Builds the Chocolatey package and pushes it to the Chocolatey Community
# Repository whenever a GitHub Release is published.
#
# IMPORTANT — first submission:
# The very first push of a new package ID to community.chocolatey.org goes
# through manual moderation review (can take a few business days). This
# workflow will push it; the maintainer then watches the package page at
# https://community.chocolatey.org/packages/rackstack and responds to any
# moderator comments. Subsequent version updates from an established
# publisher are usually auto-approved.
#
# Requires the CHOCO_API_KEY repo secret (from
# https://community.chocolatey.org/account). Skips silently if absent.
#
# choco CLI is pre-installed on GitHub-hosted windows-latest runners.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v1.98.57). Blank = latest."
        required: false

permissions: read-all

jobs:
  publish:
    name: Build + push Chocolatey package
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Detect CHOCO_API_KEY
        id: keycheck
        env:
          K: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:K)) {
            Write-Host "CHOCO_API_KEY secret not set — skipping Chocolatey publish."
            Write-Host "To enable: add the secret from https://community.chocolatey.org/account"
            "configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Resolve release version
        id: ver
        if: steps.keycheck.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq '.tagName')
          }
          $ver = $tag -replace '^v', ''
          Write-Host "Packaging version: $ver (tag $tag)"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download release EXE + compute checksum
        id: dl
        if: steps.keycheck.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $tag = '${{ steps.ver.outputs.tag }}'
          # Download the EXE from the release so we can compute the real SHA-256.
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern 'RackStack.exe' --dir dl
          $exe = 'dl/RackStack.exe'
          if (-not (Test-Path $exe)) { throw "RackStack.exe not found in release $tag" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $hash"
          "checksum=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stamp nuspec + install script
        if: steps.keycheck.outputs.configured == 'true'
        run: |
          $ver  = '${{ steps.ver.outputs.version }}'
          $hash = '${{ steps.dl.outputs.checksum }}'
          Push-Location dist/chocolatey
          # Replace placeholders in a copy so the repo source stays templated.
          (Get-Content 'rackstack.nuspec' -Raw) -replace '<version>0\.0\.0</version>', "<version>$ver</version>" |
            Set-Content 'rackstack.nuspec' -Encoding utf8
          (Get-Content 'tools/chocolateyinstall.ps1' -Raw) `
            -replace '__VERSION__', $ver `
            -replace '__CHECKSUM_SHA256__', $hash |
            Set-Content 'tools/chocolateyinstall.ps1' -Encoding utf8
          Pop-Location

      - name: Pack + push
        if: steps.keycheck.outputs.configured == 'true'
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          Push-Location dist/chocolatey
          choco pack rackstack.nuspec
          $nupkg = Get-ChildItem -Filter 'rackstack.*.nupkg' | Select-Object -First 1
          if (-not $nupkg) { throw "choco pack produced no .nupkg" }
          Write-Host "Packed: $($nupkg.Name)"
          choco apikey --key $env:CHOCO_API_KEY --source https://push.chocolatey.org/
          choco push $nupkg.FullName --source https://push.chocolatey.org/
          if ($LASTEXITCODE -ne 0) {
            Write-Host "choco push exit $LASTEXITCODE — if this is the FIRST submission, the package"
            Write-Host "may still be queued for moderation. Check https://community.chocolatey.org/packages/rackstack"
          }
          $global:LASTEXITCODE = 0
          Pop-Location
          exit 0
